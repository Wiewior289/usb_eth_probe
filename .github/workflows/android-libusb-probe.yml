name: Android libusb probe build

on:
  pull_request:
    branches: [main, diagnostics/descriptor-first]
  push:
    branches: [experiment/libusb-android-probe, experiment/libusb-controlled-ecm]

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-configuration-cache
